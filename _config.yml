# GitHub Pages Configuration
title: "Alejandro Andres Juanes"
description: "Personal website of Alejandro Andres Juanes - researcher and developer"
url: "https://aleaj.github.io"
baseurl: ""

# Author information (keep for Jekyll compatibility)
author:
  name: "Alejandro Andres Juanes"
  email: "Alejandro.AndresJuanes@ista.ac.at"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude files/folders from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .asset-cache

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# SEO and social
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Site Configuration (you can customize these)
# Navigation menu
navigation:
  - name: "Home"
    url: "/"
  - name: "Resume"
    url: "/resume/"
  - name: "Research"
    url: "/research/"
  - name: "Blog"
    url: "/blog/"

# Homepage settings
homepage:
  show_latest_posts: true
  posts_count: 3