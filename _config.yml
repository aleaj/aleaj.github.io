# GitHub Pages Configuration
title: "Alejandro Andres Juanes"
description: "Welcome to my personal website"
url: "https://aleaj.github.io"
baseurl: ""

# Author information
author:
  name: "Alejandro Andres Juanes"
  email: "Alejandro.AndresJuanes@ista.ac.at"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude files/folders from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .asset-cache

# Collections for blog posts
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# SEO and social
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag