  Currently, I'm pursuing my PhD at the Institute of Science and Technology Austria (ISTA),
  focusing on microwave quantum optics and superconducting circuits. My work involves exploring
  the quantum properties of light-matter interactions in these systems.

# About section
about: |
  I am a physics researcher with a passion for quantum optics and superconducting circuits. My research focuses on
  microwave quantum optics, and I have experience in quantum information processing and experimental physics.
  I enjoy tackling complex problems at the intersection of theory and experiment, and am always eager to
  collaborate on exciting projects in quantum physics.

about_extended: |
  My academic journey began with a strong foundation in physics, and since then, I've focused on the fascinating
  world of quantum optics and superconducting circuits. I'm particularly interested in how quantum mechanics
  manifests in engineered systems and how we can harness these phenomena for quantum technologies.

# Current status/news
current_status: |
  I'm currently working on microwave quantum optics experiments and looking forward to new discoveries
  in the field of superconducting quantum devices.

# Research interests
research_interests:
  - title: "Microwave Quantum Optics"
    description: "I'm interested in the interaction of microwave photons with superconducting circuits, exploring phenomena such as quantum coherence, entanglement, and non-classical states of light. My work aims to understand and harness these interactions for applications in quantum information processing and quantum communication."

  - title: "Superconducting Circuits"
    description: "Investigation of superconducting quantum devices and their applications in quantum computing and quantum sensing. I focus on understanding the fundamental physics of these artificial atoms and their interactions with electromagnetic fields."

  - title: "Quantum Information Processing"
    description: "Exploring how quantum mechanical principles can be used to process and transmit information in ways that are impossible with classical systems, particularly using superconducting circuit architectures."

