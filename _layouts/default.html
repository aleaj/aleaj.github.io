<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Theme Detection Script (prevent FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    {% seo %}
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="/" class="nav-logo-link">{{ site.data.personal.name }}</a>
                </div>

                <ul class="nav-menu" id="nav-menu">
                    {% for nav_item in site.navigation %}
                    <li class="nav-item">
                        <a href="{{ nav_item.url }}" class="nav-link {% if page.url == nav_item.url or (nav_item.url != '/' and page.url contains nav_item.url) %}active{% endif %}">{{ nav_item.name }}</a>
                    </li>
                    {% endfor %}
                </ul>

                <div class="nav-controls">
                    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun"></i>
                    </button>

                    <div class="nav-toggle" id="nav-toggle">
                        <span class="nav-toggle-line"></span>
                        <span class="nav-toggle-line"></span>
                        <span class="nav-toggle-line"></span>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-links">
                    {% for link in site.data.links.footer_links %}
                    <a href="{{ link.url }}" class="footer-link" aria-label="{{ link.label }}"{% if link.url contains 'http' %} target="_blank"{% endif %}>
                        <i class="{{ link.icon }}"></i>
                    </a>
                    {% endfor %}
                </div>
                <div class="footer-text">
                    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.data.personal.name }}. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/js/main.js"></script>
</body>
</html>
